application:
  subdomain: pg36g
  multi_instance: false
  upstreams:
    - location: /
      backend: file:///lzcapp/pkg/content/site/
usage: |
  《PG 三十六计》是 Vonng 编写的 PostgreSQL 与 Pigsty 实战书籍，本包仅提供固定版本的本地静态阅读。
  内容采用 CC BY-NC-SA 4.0：必须署名、仅限非商业使用、改编须以相同协议分享。作者、原站、源码快照与完整许可证见 /package-notice.html 和 /LICENSE.txt。
  2026.10.31 是阅读包快照版本，不代表作者发布的书籍版本。原站仍为权威更新来源。
  本包不包含或运行 PostgreSQL、Pigsty、数据库或实验环境，不需要应用容器与数据库，也不会自动执行书中脚本。
  实验素材含数据库重置、故障注入及恢复操作，只应在隔离实验环境中人工审查后使用，勿直接用于生产环境。
  保留懒猫入口认证；本地静态页面与资源打入 LPK，外部参考链接和第三方服务仍需网络。
  未验证懒猫实机阅读、全文搜索、打印、移动端或所有实验链接；构建检查不代表实验或生产操作通过。
